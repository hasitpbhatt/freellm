name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + unit tests
        # `npm test` compiles the test project (functions/lib + tests) and runs
        # everything on Node's built-in runner — the D1-backed metering suite
        # uses miniflare from wrangler's dependency tree, no extra installs.
        run: npm test

      - name: Production build (typecheck + vite)
        run: npm run build

  # Optional: auto-deploy to Cloudflare Pages when pushing to the default
  # branch. Enable by setting the CF_PAGES_DEPLOY toggle repository variable to
  # "true" and adding the two secrets (Settings → Secrets and variables →
  # Actions). With the toggle off (default) this job is skipped.
  deploy:
    name: deploy (Cloudflare Pages)
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && vars.CF_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=freellm
