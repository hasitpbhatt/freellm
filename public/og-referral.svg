<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative orbs -->
  <circle cx="150" cy="150" r="200" fill="url(#accentGradient)" opacity="0.08" filter="blur(80px)"/>
  <circle cx="1050" cy="480" r="180" fill="#a855f7" opacity="0.06" filter="blur(80px)"/>
  <circle cx="600" cy="315" r="300" fill="#22d3ee" opacity="0.03" filter="blur(100px)"/>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- freellm logo/icon -->
    <circle r="70" fill="#0f172a" stroke="url(#accentGradient)" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#textGradient)">f</text>
    
    <!-- Title -->
    <text x="0" y="110" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
      Join me on freellm
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="165" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">
      Free AI chat • Daily rewards • Referral bonuses
    </text>
    
    <!-- Credit rewards -->
    <g transform="translate(0, 230)">
      <rect x="-180" y="-35" width="360" height="70" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="18" fill="#f8fafc">
        You both get <tspan fill="url(#textGradient)" font-weight="700">500,000 credits</tspan> when they qualify
      </text>
    </g>
    
    <!-- Milestones -->
    <g transform="translate(0, 320)">
      <text x="0" y="-10" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">
        Milestone rewards for your friend:
      </text>
      <g transform="translate(-200, 25)">
        <!-- Milestone 1 -->
        <g transform="translate(0, 0)">
          <circle cx="16" cy="16" r="16" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
          <text x="16" y="20" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">✓</text>
          <text x="45" y="23" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0">50k on signup</text>
        </g>
        <!-- Milestone 2 -->
        <g transform="translate(0, 40)">
          <circle cx="16" cy="16" r="16" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
          <text x="16" y="20" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">✓</text>
          <text x="45" y="23" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0">25k on day 1 check-in</text>
        </g>
        <!-- Milestone 3 -->
        <g transform="translate(0, 80)">
          <circle cx="16" cy="16" r="16" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="2"/>
          <text x="16" y="20" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">✓</text>
          <text x="45" y="23" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0">200k at 7-day streak</text>
        </g>
        <!-- Milestone 4 -->
        <g transform="translate(0, 120)">
          <circle cx="16" cy="16" r="16" fill="#a855f7" opacity="0.2" stroke="#a855f7" stroke-width="2"/>
          <text x="16" y="20" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">✓</text>
          <text x="45" y="23" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0">225k at 200k Pool tokens</text>
        </g>
      </g>
    </g>
    
    <!-- CTA -->
    <g transform="translate(0, 480)">
      <rect x="-140" y="-25" width="280" height="50" rx="25" fill="url(#accentGradient)"/>
      <text x="0" y="7" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
        Tap to join free
      </text>
    </g>
  </g>
  
  <!-- Bottom branding -->
  <text x="600" y="600" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">
    freellm.xyz — Free AI for everyone
  </text>
</svg>